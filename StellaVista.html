function jdAt(m){const[y,mo,d]=$('#dt').value.split('-').map(Number),tz=Math.round(lon/15);return(Date.UTC(y,mo-1,d,18,0)+m*6e4-tz*36e5)/864e5+2440587.5}

const norm=a=>((a%360)+360)%360;
function draw(t){
 g.setTransform(dpr,0,0,dpr,0,0);

  [[MA,'rgba(150,125,255,.05)'],[MB,'rgba(225,140,255,.06)']].forEach(([arr,c])=>{g.fillStyle=c;for(const q of arr){const[az,al]=aa(q.ra,q.dec,L);if(al<-.02)continue;const p=P(az,al);if(p)g.fillRect(p[0]-s/2,p[1]-s/2,s,s)}});g.globalCompositeOperation='source-over'}
 // horizonte
 g.strokeStyle='rgba(196,181,253,.4)';g.lineWidth=1.2;g.beginPath();let pen=false;
 for(let a=0;a<=360;a+=3){const p=P(a*D,0);if(!p){pen=false;continue}pen?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);pen=true}g.stroke();
 g.font='700 11px Space Grotesk,sans-serif';g.textAlign='center';
 ['N','NE','E','SE','S','SO','O','NO'].forEach((n,i)=>{const p=P(i*45*D,.03);if(!p)return;g.fillStyle=i?'rgba(196,181,253,.85)':'#e879f9';g.fillText(n,p[0],p[1]+16)});
 // constelaciones
 if(opt.lines)CON.forEach(c=>{const on=c===sel;g.strokeStyle=on?'rgba(232,121,249,.9)':'rgba(168,140,255,.32)';g.lineWidth=on?1.6:1;g.beginPath();c.lines.forEach(([A,B])=>{if(A.al<-.05||B.al<-.05)return;const p=P(A.az,A.al),q=P(B.az,B.al);if(p&&q){g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1])}});g.stroke()});

 g.fillStyle='#fff';
 for(const b of BG){const[az,al]=aa(b.ra,b.dec,L);if(al<0)continue;const p=P(az,al);if(!p)continue;g.globalAlpha=Math.min(.75,(6.8-b.m)*.22);g.beginPath();g.arc(p[0],p[1],(6.5-b.m)*.28*zf+.25,0,7);g.fill()}

 for(const s of Object.values(ST)){if(s.al<0)continue;const p=P(s.az,s.al);if(!p)continue;const rr=Math.max(.8,(5.2-s.mag)*.5)*zf;

function compass(){const c=$('#cmp').getContext('2d'),R=62,m=84;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,168,168);c.translate(m,m);

 c.font='700 15px Space Grotesk,sans-serif';c.textAlign='center';c.textBaseline='middle';
 [['N',0],['E',90],['S',180],['O',270]].forEach(([n,a])=>{const q=(a-view.az)*D;c.fillStyle=a?'#c4b5fd':'#e879f9';c.fillText(n,Math.sin(q)*(R-16),-Math.cos(q)*(R-16))});
 if(sel.az!=null){const q=sel.az-view.az*D;c.fillStyle='#fff';c.shadowColor='#e879f9';c.shadowBlur=8;c.beginPath();c.arc(Math.sin(q)*R,-Math.cos(q)*R,5,0,7);c.fill();c.shadowBlur=0}

// estado
function upd(){L0=lstAt(0);L=L0+.25068447733*mins;for(const o of ALL){const[a,b]=aa(o.ra,o.dec,L);o.az=a;o.al=b}}
const stt=a=>a>15?['VISIBLE','ok']:a>0?['BAJO','']:['NO VISIBLE','no'];
const fd=d=>!d?'—':d>=1e6?(d/1e6).toFixed(1).replace('.',',')+' M años luz':d.toLocaleString('es')+' años luz';
function list(){const q=$('#q').value.toLowerCase(),LS=$('#list'),sy=LS.scrollTop;const html=O.filter(o=>(tab=='all'||o.type==tab)&&o.name.toLowerCase().includes(q)).map(o=>{const s=stt(o.al/D);return`<div class="it${o===sel?' on':''}" data-i="${O.indexOf(o)}"><div><b>${o.name}</b><small>${o.sub}</small></div><span class="pill ${s[1]}">${s[0]}</span></div>`}).join('');if(html===list.h)return;list.h=html;LS.innerHTML=html;LS.scrollTop=sy}
function ui(){
 const n=O.filter(o=>o.al>0).length;$('#nv').textContent=n;$('#nt').textContent=O.length;$('#bv').style.width=n/O.length*100+'%';

 for(let i=0;i<=72;i++)av.push(altD(o,i*10));

 x.strokeStyle='#fff';x.beginPath();x.moveTo(mins/720*cw,0);x.lineTo(mins/720*cw,ch-16);x.stroke();
 x.fillStyle='#8d82b5';x.font='10px Space Grotesk';x.textAlign='center';[0,180,360,540,720].forEach(m=>x.fillText(tm(m).slice(0,2)+'h',Math.min(Math.max(m/720*cw,10),cw-10),ch-3));

}
function choose(o){sel=o;upd();fly={az:norm(o.az/D),alt:Math.max(o.al/D,8),z:o.type=='c'?1.3:2.3};ui()}
// bucle
function frame(t){
 if(playing){mins+=.8;if(mins>720)mins=0;$('#rg').value=mins}
 if(fly){let d=((fly.az-view.az+540)%360)-180;view.az=norm(view.az+d*.1);view.alt+=(fly.alt-view.alt)*.1;view.z+=(fly.z-view.z)*.08;if(Math.abs(d)<.1&&Math.abs(fly.alt-view.alt)<.1)fly=null}

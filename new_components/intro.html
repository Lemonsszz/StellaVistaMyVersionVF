<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Observatorio Astronómico — Inicio de Misión</title>

  <!-- Google Fonts: Orbitron (display) + Inter (cuerpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --c-bg:         #03040f;
      --c-nebula1:    #0d0838;
      --c-nebula2:    #1a0a5e;
      --c-accent:     #4d9fff;
      --c-accent2:    #a78bfa;
      --c-white:      #e8f4ff;
      --c-glow:       rgba(77, 159, 255, 0.55);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--c-bg);
      font-family: 'Inter', sans-serif;
      color: var(--c-white);
      user-select: none;
    }

    /* ============================================================
       CANVAS DE FONDO (estrellas + nebulosas)
    ============================================================ */
    #space-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ============================================================
       CAPAS DE PARALLAX
    ============================================================ */
    .parallax-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* ============================================================
       PANTALLA DE BIENVENIDA
    ============================================================ */
    #welcome-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      transition: opacity 0.8s ease;
    }

    /* Icono de cohete / telescopio decorativo */
    .mission-badge {
      width: 72px;
      height: 72px;
      border: 1.5px solid rgba(77,159,255,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(77,159,255,0.06);
      animation: badgePulse 3s ease-in-out infinite;
      margin-bottom: 0.25rem;
    }
    .mission-badge svg { width: 36px; height: 36px; }

    @keyframes badgePulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(77,159,255,0); }
      50%      { box-shadow: 0 0 0 12px rgba(77,159,255,0.18); }
    }

    /* Título principal */
    .main-title {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(1.5rem, 5vw, 3.2rem);
      letter-spacing: 0.35em;
      text-align: center;
      background: linear-gradient(135deg, #e8f4ff 0%, #a78bfa 50%, #4d9fff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titleGlow 4s ease-in-out infinite alternate;
    }
    @keyframes titleGlow {
      from { filter: drop-shadow(0 0 10px rgba(77,159,255,0.3)); }
      to   { filter: drop-shadow(0 0 24px rgba(167,139,250,0.7)); }
    }

    .subtitle {
      font-weight: 300;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      letter-spacing: 0.12em;
      color: rgba(232,244,255,0.65);
      text-align: center;
    }

    /* Divisor decorativo */
    .divider {
      width: 160px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--c-accent), transparent);
      margin: 0.25rem auto;
    }

    /* Input glassmorphism */
    .input-wrapper {
      position: relative;
      width: min(380px, 90vw);
    }
    .input-wrapper::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(77,159,255,0.6), rgba(167,139,250,0.4));
      z-index: -1;
      opacity: 0;
      transition: opacity 0.35s;
    }
    .input-wrapper:focus-within::before { opacity: 1; }

    #name-input {
      width: 100%;
      padding: 1rem 1.4rem;
      background: rgba(13,8,56,0.55);
      border: 1.5px solid rgba(77,159,255,0.28);
      border-radius: 11px;
      color: var(--c-white);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.06em;
      outline: none;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    #name-input::placeholder { color: rgba(232,244,255,0.3); }
    #name-input:focus {
      border-color: rgba(77,159,255,0.7);
      box-shadow: 0 0 0 3px rgba(77,159,255,0.15), 0 0 30px rgba(77,159,255,0.1) inset;
    }

    /* Botón principal */
    #launch-btn {
      position: relative;
      padding: 0.9rem 2.8rem;
      background: linear-gradient(135deg, #1a4c8a 0%, #0d0838 100%);
      border: 1.5px solid rgba(77,159,255,0.5);
      border-radius: 50px;
      color: var(--c-white);
      font-family: 'Orbitron', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.3s, border-color 0.3s;
    }
    #launch-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(77,159,255,0.18), rgba(167,139,250,0.12));
      opacity: 0;
      transition: opacity 0.3s;
    }
    #launch-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 36px rgba(77,159,255,0.45), 0 8px 24px rgba(0,0,0,0.6);
      border-color: rgba(77,159,255,0.9);
    }
    #launch-btn:hover::before { opacity: 1; }
    #launch-btn:active { transform: translateY(0) scale(0.99); }

    /* Shimmer sweep on button */
    #launch-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -75%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      transform: skewX(-20deg);
      animation: shimmer 3s infinite;
    }
    @keyframes shimmer {
      0%   { left: -75%; }
      60%  { left: 130%; }
      100% { left: 130%; }
    }

    /* Texto de estado debajo del botón */
    .status-line {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: rgba(77,159,255,0.45);
      text-transform: uppercase;
      animation: blink 2.5s step-end infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; } 50% { opacity: 0.25; }
    }

    /* ============================================================
       PANTALLA DE ANIMACIÓN (letras + OVNI)
    ============================================================ */
    #animation-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Contenedor de letras del nombre */
    #letters-container {
      display: flex;
      gap: clamp(8px, 2vw, 24px);
      align-items: center;
      justify-content: center;
    }
    .name-letter {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(3rem, 10vw, 8rem);
      color: #e8f4ff;
      text-shadow:
        0 0 20px rgba(77,159,255,0.8),
        0 0 60px rgba(77,159,255,0.3),
        0 0 100px rgba(167,139,250,0.2);
      opacity: 0;
      display: inline-block;
      will-change: transform, opacity;
    }

    /* SVG del OVNI */
    #ufo {
      position: absolute;
      width: clamp(120px, 22vw, 240px);
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
      filter: drop-shadow(0 0 20px rgba(77,159,255,0.7));
    }

    /* Rayo tractor */
    #tractor-beam {
      position: absolute;
      width: clamp(60px, 10vw, 110px);
      opacity: 0;
      pointer-events: none;
      transform-origin: top center;
      will-change: transform, opacity;
    }

    /* ============================================================
       PANTALLA DE TRANSICIÓN WARP
    ============================================================ */
    #warp-screen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      overflow: hidden;
      background: var(--c-bg);
    }
    #warp-canvas {
      position: absolute;
      inset: 0;
    }

    /* ============================================================
       FLASH FINAL
    ============================================================ */
    #flash-overlay {
      position: fixed;
      inset: 0;
      z-index: 99;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    /* ============================================================
       RESPONSIVE TWEAKS
    ============================================================ */
    @media (max-width: 480px) {
      .main-title { letter-spacing: 0.18em; }
      #launch-btn { padding: 0.8rem 2rem; font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<!-- ============================================================
     CANVAS DE FONDO ESPACIAL
============================================================ -->
<canvas id="space-canvas"></canvas>

<!-- ============================================================
     PANTALLA INICIAL DE BIENVENIDA
============================================================ -->
<div id="welcome-screen">

  <!-- Icono de misión (telescopio SVG inline) -->
  <div class="mission-badge">
    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="18" cy="18" r="17" stroke="rgba(77,159,255,0.5)" stroke-width="1"/>
      <!-- Telescopio simplificado -->
      <path d="M8 22 L17 10 L22 13 L13 25 Z" fill="rgba(77,159,255,0.7)" stroke="rgba(77,159,255,0.9)" stroke-width="0.5"/>
      <rect x="14" y="24" width="2" height="5" rx="1" fill="rgba(167,139,250,0.8)"/>
      <rect x="11" y="28" width="8" height="1.5" rx="0.75" fill="rgba(167,139,250,0.6)"/>
      <circle cx="22" cy="13" r="3" fill="none" stroke="rgba(77,159,255,0.5)" stroke-width="0.8"/>
      <circle cx="9" cy="8" r="1.5" fill="rgba(255,220,100,0.9)"/>
      <circle cx="26" cy="6" r="1" fill="rgba(167,139,250,0.9)"/>
      <circle cx="28" cy="20" r="0.8" fill="rgba(77,159,255,0.8)"/>
    </svg>
  </div>

  <h1 class="main-title">BIENVENIDO COSMONAUTA</h1>
  <div class="divider"></div>
  <p class="subtitle">¿Cómo deseas que te llamemos?</p>

  <div class="input-wrapper">
    <input
      id="name-input"
      type="text"
      placeholder="Ingresa tu nombre"
      maxlength="14"
      autocomplete="off"
      spellcheck="false"
    />
  </div>

  <button id="launch-btn" aria-label="Iniciar misión">
    INICIAR MISIÓN
  </button>

  <span class="status-line">Sistema listo · Aguardando cosmonauta</span>
</div>

<!-- ============================================================
     PANTALLA DE ANIMACIÓN (letras + OVNI)
============================================================ -->
<div id="animation-screen">
  <div id="letters-container"></div>

  <!-- SVG OVNI futurista -->
  <svg id="ufo" viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg">
    <!-- Cuerpo principal -->
    <defs>
      <radialGradient id="bodyGrad" cx="50%" cy="40%" r="55%">
        <stop offset="0%"   stop-color="#8ab4d8"/>
        <stop offset="50%"  stop-color="#3a6fa8"/>
        <stop offset="100%" stop-color="#1a2d50"/>
      </radialGradient>
      <radialGradient id="domeGrad" cx="40%" cy="35%" r="60%">
        <stop offset="0%"   stop-color="rgba(200,230,255,0.55)"/>
        <stop offset="100%" stop-color="rgba(60,120,200,0.18)"/>
      </radialGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="rgba(100,200,255,0.65)"/>
        <stop offset="100%" stop-color="rgba(100,200,255,0)"/>
      </linearGradient>
    </defs>

    <!-- Anillo inferior -->
    <ellipse cx="120" cy="75" rx="98" ry="18" fill="url(#bodyGrad)" stroke="rgba(100,180,255,0.35)" stroke-width="1"/>
    <!-- Detalle anillo -->
    <ellipse cx="120" cy="73" rx="85" ry="13" fill="none" stroke="rgba(100,180,255,0.2)" stroke-width="0.8"/>

    <!-- Cuerpo central -->
    <ellipse cx="120" cy="68" rx="70" ry="22" fill="url(#bodyGrad)"/>

    <!-- Cúpula superior -->
    <path d="M80,68 Q90,30 120,24 Q150,30 160,68 Z" fill="url(#domeGrad)" stroke="rgba(180,220,255,0.3)" stroke-width="0.8"/>

    <!-- Luces perimetrales -->
    <circle cx="55"  cy="76" r="4" fill="#4de0ff" filter="url(#glow)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80"  cy="82" r="3.5" fill="#a78bfa" filter="url(#glow)" opacity="0.85">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="85" r="4" fill="#4de0ff" filter="url(#glow)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="82" r="3.5" fill="#a78bfa" filter="url(#glow)" opacity="0.85">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="76" r="4" fill="#4de0ff" filter="url(#glow)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.1s" repeatCount="indefinite"/>
    </circle>

    <!-- Reflejo cúpula -->
    <ellipse cx="105" cy="44" rx="12" ry="6" fill="rgba(255,255,255,0.12)" transform="rotate(-20,105,44)"/>

    <!-- Detalle central inferior -->
    <circle cx="120" cy="76" r="8" fill="rgba(77,159,255,0.2)" stroke="rgba(77,159,255,0.5)" stroke-width="0.8"/>
    <circle cx="120" cy="76" r="4" fill="rgba(100,200,255,0.4)">
      <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </svg>

  <!-- RAYO TRACTOR (SVG separado para posicionamiento dinámico) -->
  <svg id="tractor-beam" viewBox="0 0 110 280" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <defs>
      <linearGradient id="tractorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="rgba(77,200,255,0.7)"/>
        <stop offset="100%" stop-color="rgba(77,200,255,0)"/>
      </linearGradient>
    </defs>
    <polygon points="45,0 65,0 110,280 0,280" fill="url(#tractorGrad)"/>
    <!-- Líneas de energía internas -->
    <line x1="55" y1="0" x2="55" y2="280" stroke="rgba(150,230,255,0.25)" stroke-width="1">
      <animate attributeName="opacity" values="0.25;0.6;0.25" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="40" y1="0" x2="20" y2="280" stroke="rgba(150,230,255,0.12)" stroke-width="0.7">
      <animate attributeName="opacity" values="0.12;0.4;0.12" dur="1.3s" repeatCount="indefinite"/>
    </line>
    <line x1="70" y1="0" x2="90" y2="280" stroke="rgba(150,230,255,0.12)" stroke-width="0.7">
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="1.1s" repeatCount="indefinite"/>
    </line>
  </svg>
</div>

<!-- ============================================================
     PANTALLA DE WARP / TRANSICIÓN HIPERESPACIAL
============================================================ -->
<div id="warp-screen">
  <canvas id="warp-canvas"></canvas>
</div>

<!-- Flash blanco final -->
<div id="flash-overlay"></div>

<!-- ============================================================
     JAVASCRIPT — TODA LA LÓGICA
============================================================ -->
<script>
/* ===========================================================
   CONFIGURACIÓN GLOBAL
=========================================================== */
// ⚠️ CAMBIAR AQUÍ el destino final del dashboard
const DASHBOARD_URL = 'dashboard.html';

/* ===========================================================
   1. FONDO ESPACIAL — Canvas animado (estrellas + nebulosas + meteoros)
=========================================================== */
(function() {
  const canvas = document.getElementById('space-canvas');
  const ctx    = canvas.getContext('2d');

  let W, H, stars = [], nebulaClouds = [], meteors = [], dust = [];
  let mouseX = 0, mouseY = 0;
  let animFrame;

  // Resize
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    init();
  }

  // Inicializar partículas
  function init() {
    stars = [];
    nebulaClouds = [];
    dust = [];

    // Estrellas (3 capas para profundidad)
    for (let i = 0; i < 380; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.8 + 0.3,
        alpha: Math.random() * 0.6 + 0.3,
        speed: Math.random() * 0.0004 + 0.0001,
        twinkleOffset: Math.random() * Math.PI * 2,
        parallax: Math.random() * 0.012 + 0.002,
        color: Math.random() > 0.85 ? '#a78bfa' : '#e8f4ff',
      });
    }

    // Polvo cósmico
    for (let i = 0; i < 80; i++) {
      dust.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 0.7 + 0.2,
        dx: (Math.random() - 0.5) * 0.08,
        dy: Math.random() * 0.04 + 0.01,
        alpha: Math.random() * 0.18 + 0.04,
      });
    }

    // Nubes de nebulosa
    for (let i = 0; i < 5; i++) {
      nebulaClouds.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.75,
        rx: Math.random() * 200 + 120,
        ry: Math.random() * 100 + 60,
        alpha: Math.random() * 0.07 + 0.02,
        hue: Math.random() > 0.5 ? '200,100,255' : '100,160,255',
        dx: (Math.random() - 0.5) * 0.05,
        dy: (Math.random() - 0.5) * 0.025,
        angle: Math.random() * Math.PI * 2,
      });
    }
  }

  // Agregar meteoro ocasional
  function spawnMeteor() {
    meteors.push({
      x: Math.random() * W * 1.3,
      y: -20,
      len: Math.random() * 80 + 40,
      speed: Math.random() * 6 + 4,
      alpha: 1,
      angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
    });
  }

  setInterval(spawnMeteor, 3500 + Math.random() * 4000);

  // Parallax con mouse
  window.addEventListener('mousemove', e => {
    mouseX = (e.clientX - W / 2) / W;
    mouseY = (e.clientY - H / 2) / H;
  });

  // Loop de render
  function draw(t) {
    ctx.clearRect(0, 0, W, H);

    // Fondo degradado profundo
    const bg = ctx.createRadialGradient(W * 0.4, H * 0.35, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
    bg.addColorStop(0,   '#0d0838');
    bg.addColorStop(0.4, '#060420');
    bg.addColorStop(1,   '#020110');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Nebulosas
    nebulaClouds.forEach(n => {
      n.x += n.dx;  n.y += n.dy;
      if (n.x < -200) n.x = W + 200;
      if (n.x > W+200) n.x = -200;
      if (n.y < -100) n.y = H + 100;
      if (n.y > H+100) n.y = -100;
      ctx.save();
      ctx.translate(n.x + mouseX * 18, n.y + mouseY * 10);
      ctx.rotate(n.angle + t * 0.00005);
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, n.rx);
      grad.addColorStop(0,   `rgba(${n.hue},${n.alpha})`);
      grad.addColorStop(0.5, `rgba(${n.hue},${n.alpha * 0.5})`);
      grad.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.scale(1, n.ry / n.rx);
      ctx.beginPath();
      ctx.arc(0, 0, n.rx, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // Estrellas con parpadeo
    stars.forEach(s => {
      const px = s.x + mouseX * s.parallax * W * 22;
      const py = s.y + mouseY * s.parallax * H * 22;
      const tw = Math.sin(t * s.speed * 6000 + s.twinkleOffset) * 0.3 + 0.7;
      ctx.save();
      ctx.globalAlpha = s.alpha * tw;
      ctx.fillStyle = s.color;
      ctx.shadowBlur = s.r > 1.2 ? 6 : 0;
      ctx.shadowColor = s.color;
      ctx.beginPath();
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // Polvo cósmico
    dust.forEach(d => {
      d.x += d.dx; d.y += d.dy;
      if (d.y > H) { d.y = -2; d.x = Math.random() * W; }
      ctx.save();
      ctx.globalAlpha = d.alpha;
      ctx.fillStyle = '#8bb8ff';
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // Meteoros
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += Math.cos(m.angle) * m.speed;
      m.y += Math.sin(m.angle) * m.speed;
      m.alpha -= 0.018;
      if (m.alpha <= 0) { meteors.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = m.alpha;
      ctx.strokeStyle = '#c8e8ff';
      ctx.lineWidth = 1.4;
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#4d9fff';
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - Math.cos(m.angle) * m.len, m.y - Math.sin(m.angle) * m.len);
      ctx.stroke();
      ctx.restore();
    }

    animFrame = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();


/* ===========================================================
   2. LÓGICA DE INTERACCIÓN — Botón "Iniciar Misión"
=========================================================== */
const welcomeScreen    = document.getElementById('welcome-screen');
const animationScreen  = document.getElementById('animation-screen');
const lettersContainer = document.getElementById('letters-container');
const ufo              = document.getElementById('ufo');
const tractorBeam      = document.getElementById('tractor-beam');
const warpScreen       = document.getElementById('warp-screen');
const flashOverlay     = document.getElementById('flash-overlay');
const nameInput        = document.getElementById('name-input');
const launchBtn        = document.getElementById('launch-btn');

// Permitir Enter para lanzar
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') launchBtn.click(); });

launchBtn.addEventListener('click', () => {
  const name = nameInput.value.trim().toUpperCase();
  if (!name) {
    nameInput.focus();
    nameInput.style.borderColor = 'rgba(255,80,80,0.7)';
    setTimeout(() => nameInput.style.borderColor = '', 800);
    return;
  }
  startSequence(name);
});


/* ===========================================================
   3. SECUENCIA COMPLETA DE ANIMACIÓN
=========================================================== */
function startSequence(name) {
  // FASE 0 — Ocultar pantalla de bienvenida
  welcomeScreen.style.opacity = '0';
  setTimeout(() => {
    welcomeScreen.style.display = 'none';
    runLetterPhase(name);
  }, 800);
}

/* --- FASE 1 & 2 — Aparición y caída de letras --- */
function runLetterPhase(name) {
  animationScreen.style.display = 'flex';
  lettersContainer.innerHTML = '';

  const letters = [];
  for (const char of name) {
    const span = document.createElement('span');
    span.className = 'name-letter';
    span.textContent = char;
    lettersContainer.appendChild(span);
    letters.push(span);
  }

  // Aparición escalonada de letras
  letters.forEach((el, i) => {
    setTimeout(() => {
      el.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, i * 120 + 200);
  });

  // Esperar a que todas aparezcan y luego iniciar caída
  const waitTime = letters.length * 120 + 1100;
  setTimeout(() => startFall(letters), waitTime);
}

function startFall(letters) {
  // Caída suave con gravedad reducida (física simulada)
  const startTime = performance.now();
  const duration = 2200;
  const initPositions = letters.map(el => el.getBoundingClientRect().top);

  function fallStep(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = progress * progress; // aceleración suave

    letters.forEach((el, i) => {
      const offset = i * 18; // separación entre letras
      const p = Math.max(0, Math.min(1, eased + offset * 0.0004));
      const y = p * window.innerHeight * 0.45;
      const rotation = (p * 15 - 7.5) * (i % 2 === 0 ? 1 : -1);
      const floatX = Math.sin(p * Math.PI * 1.5 + i) * 12 * (1 - p * 0.5);
      el.style.transform = `translate(${floatX}px, ${y}px) rotate(${rotation}deg)`;
    });

    if (progress < 1) {
      requestAnimationFrame(fallStep);
    } else {
      // Letras han caído — traer OVNI
      setTimeout(() => spawnUFO(letters), 400);
    }
  }
  requestAnimationFrame(fallStep);
}

/* --- FASE 3 — OVNI entra, rayo tractor, absorbe letras --- */
function spawnUFO(letters) {
  const screenW = window.innerWidth;
  const screenH = window.innerHeight;

  // Posición objetivo del OVNI: centro-superior
  const ufoW = ufo.getBoundingClientRect().width || parseInt(getComputedStyle(ufo).width) || 200;
  const targetX = (screenW - ufoW) / 2;
  const targetY = screenH * 0.15;

  // El OVNI entra desde la derecha
  ufo.style.position  = 'absolute';
  ufo.style.left = (screenW + 60) + 'px';
  ufo.style.top  = targetY + 'px';
  ufo.style.opacity   = '1';

  // Animación de entrada del OVNI
  const enterStart = performance.now();
  const enterDuration = 1600;

  function ufoEnter(now) {
    const p = Math.min((now - enterStart) / enterDuration, 1);
    const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
    const currentX = (screenW + 60) + (targetX - screenW - 60) * eased;
    // Ligero movimiento oscilante en Y
    const floatY = Math.sin(p * Math.PI * 2) * 12;
    ufo.style.left = currentX + 'px';
    ufo.style.top  = (targetY + floatY) + 'px';

    if (p < 1) {
      requestAnimationFrame(ufoEnter);
    } else {
      // OVNI en posición — mostrar rayo tractor
      setTimeout(() => activateTractorBeam(letters, targetX + ufoW / 2, targetY), 500);
    }
  }
  requestAnimationFrame(ufoEnter);
}

function activateTractorBeam(letters, ufoCenterX, ufoTopY) {
  // Posicionar rayo tractor
  const beamW = parseInt(getComputedStyle(tractorBeam).width) || 100;
  tractorBeam.style.position = 'absolute';
  tractorBeam.style.left  = (ufoCenterX - beamW / 2) + 'px';
  tractorBeam.style.top   = (ufoTopY + 80) + 'px'; // justo bajo el OVNI
  tractorBeam.style.height = '50vh';

  // Fade in del rayo
  tractorBeam.style.transition = 'opacity 0.6s ease';
  tractorBeam.style.opacity = '1';

  // Absorber letras una a una
  setTimeout(() => absorbLetters(letters, ufoCenterX, ufoTopY + 60), 700);
}

function absorbLetters(letters, ufoCenterX, ufoY) {
  let delay = 0;
  letters.forEach((el, i) => {
    setTimeout(() => {
      absorbSingleLetter(el, ufoCenterX, ufoY);
    }, delay);
    delay += 220;
  });

  // Cuando todas son absorbidas — OVNI escapa
  const totalAbsorb = delay + 700;
  setTimeout(() => {
    tractorBeam.style.opacity = '0';
    setTimeout(() => ufoEscape(), 300);
  }, totalAbsorb);
}

function absorbSingleLetter(el, targetX, targetY) {
  const rect = el.getBoundingClientRect();
  const currentX = rect.left + rect.width / 2;
  const currentY = rect.top + rect.height / 2;

  const dx = targetX - currentX;
  const dy = targetY - currentY;

  const absorbStart = performance.now();
  const absorbDuration = 600;

  function step(now) {
    const p = Math.min((now - absorbStart) / absorbDuration, 1);
    const eased = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;

    const moveX = dx * eased;
    const moveY = dy * eased;
    const scale = 1 - eased * 0.7;
    const rotate = eased * 360;

    // Combinar con la transformación de caída ya existente
    const fallTransform = `translate(calc(${moveX}px), calc(${moveY}px)) scale(${scale}) rotate(${rotate}deg)`;
    el.style.transform = fallTransform;
    el.style.opacity   = (1 - eased * 0.9).toString();

    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* --- FASE 4 — OVNI escapa con efecto warp --- */
function ufoEscape() {
  // El OVNI se sacude y luego sale disparado hacia arriba-izquierda
  ufo.style.transition = 'none';

  let shakeCount = 0;
  const shakeInterval = setInterval(() => {
    const dx = (Math.random() - 0.5) * 14;
    const dy = (Math.random() - 0.5) * 8;
    ufo.style.filter = `drop-shadow(0 0 ${20 + shakeCount * 5}px rgba(77,159,255,0.9)) brightness(${1 + shakeCount * 0.15})`;
    ufo.style.transform = `translate(${dx}px, ${dy}px)`;
    shakeCount++;
  }, 80);

  setTimeout(() => {
    clearInterval(shakeInterval);
    // Salida disparada
    const escapeStart = performance.now();
    const startLeft = parseFloat(ufo.style.left) || 0;
    const startTop  = parseFloat(ufo.style.top)  || 0;
    const escapeDuration = 700;

    function escapeStep(now) {
      const p = Math.min((now - escapeStart) / escapeDuration, 1);
      const eased = p * p * p; // ease-in cubic — aceleración brusca
      ufo.style.left = (startLeft - eased * window.innerWidth * 1.5) + 'px';
      ufo.style.top  = (startTop  - eased * window.innerHeight * 0.7) + 'px';
      ufo.style.opacity = (1 - eased * 1.1).toString();
      // Distorsión de warp en el OVNI
      ufo.style.transform = `scaleX(${1 + eased * 2.5}) scaleY(${1 - eased * 0.5})`;

      if (p < 1) {
        requestAnimationFrame(escapeStep);
      } else {
        // Iniciar transición warp al dashboard
        setTimeout(() => startWarpTransition(), 300);
      }
    }
    requestAnimationFrame(escapeStep);
  }, 700);
}

/* ===========================================================
   4. TRANSICIÓN WARP HIPERESPACIAL
=========================================================== */
function startWarpTransition() {
  warpScreen.style.display = 'block';
  const canvas = document.getElementById('warp-canvas');
  const ctx = canvas.getContext('2d');

  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  const W = canvas.width, H = canvas.height;
  const CX = W / 2, CY = H / 2;

  // Partículas de warp (estrellas que se estiran)
  const NUM_STARS = 260;
  const warpStars = Array.from({ length: NUM_STARS }, () => ({
    angle: Math.random() * Math.PI * 2,
    dist:  Math.random() * 0.4 * Math.min(W, H) * 0.5,
    speed: Math.random() * 0.9 + 0.3,
    len:   0,
    alpha: Math.random() * 0.6 + 0.3,
    color: Math.random() > 0.7 ? '#a78bfa' : '#e8f4ff',
  }));

  const startTime = performance.now();
  const totalDuration = 2800; // duración total del efecto warp

  // Fondo oscuro de warp
  ctx.fillStyle = '#01010a';
  ctx.fillRect(0, 0, W, H);

  function warpDraw(now) {
    const elapsed  = now - startTime;
    const progress = Math.min(elapsed / totalDuration, 1);

    // Aceleración warp: progreso cuadrático para mayor dramatismo
    const warpIntensity = progress * progress;

    // Fondo de warp — túnel progresivo
    ctx.fillStyle = `rgba(1,1,14,${0.06 + warpIntensity * 0.04})`;
    ctx.fillRect(0, 0, W, H);

    // Glow central
    if (warpIntensity > 0.3) {
      const glowR = warpIntensity * 280;
      const glow = ctx.createRadialGradient(CX, CY, 0, CX, CY, glowR);
      glow.addColorStop(0,   `rgba(100,160,255,${(warpIntensity - 0.3) * 0.25})`);
      glow.addColorStop(0.5, `rgba(60,80,200,${(warpIntensity - 0.3) * 0.1})`);
      glow.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);
    }

    // Dibujar y mover estrellas warp
    warpStars.forEach(s => {
      s.dist  += s.speed * (3 + warpIntensity * 22);
      s.len    = s.speed * (2 + warpIntensity * 60);

      const x1 = CX + Math.cos(s.angle) * s.dist;
      const y1 = CY + Math.sin(s.angle) * s.dist;
      const x2 = CX + Math.cos(s.angle) * (s.dist - s.len);
      const y2 = CY + Math.sin(s.angle) * (s.dist - s.len);

      ctx.save();
      ctx.globalAlpha = Math.min(s.alpha, warpIntensity + 0.2);
      ctx.strokeStyle = s.color;
      ctx.lineWidth   = 1.2 + warpIntensity * 1.8;
      ctx.shadowBlur  = 8 * warpIntensity;
      ctx.shadowColor = s.color;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.restore();

      // Resetear estrella si sale de pantalla
      const maxDist = Math.sqrt(W * W + H * H) / 2;
      if (s.dist > maxDist) {
        s.dist  = Math.random() * 30 + 5;
        s.angle = Math.random() * Math.PI * 2;
        s.speed = Math.random() * 0.9 + 0.3;
        s.color = Math.random() > 0.7 ? '#a78bfa' : '#e8f4ff';
      }
    });

    // Anillos de ondas warp (efecto distorsión espacial)
    if (warpIntensity > 0.5) {
      const rings = 3;
      for (let r = 0; r < rings; r++) {
        const rProgress = ((elapsed * 0.001 + r / rings) % 1);
        const rRadius   = rProgress * Math.max(W, H) * 0.7;
        const rAlpha    = (1 - rProgress) * (warpIntensity - 0.5) * 0.6;
        ctx.save();
        ctx.globalAlpha = rAlpha;
        ctx.strokeStyle = '#4d9fff';
        ctx.lineWidth   = 1.5;
        ctx.beginPath();
        ctx.arc(CX, CY, rRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    if (progress < 1) {
      requestAnimationFrame(warpDraw);
    } else {
      // Flash blanco de salto hiperespacial
      doFlashAndRedirect();
    }
  }

  requestAnimationFrame(warpDraw);
}

/* ===========================================================
   5. FLASH FINAL Y REDIRECCIÓN
=========================================================== */
function doFlashAndRedirect() {
  flashOverlay.style.transition = 'opacity 0.18s ease-in';
  flashOverlay.style.opacity    = '1';

  setTimeout(() => {
    // ✅ REDIRECCIÓN AL DASHBOARD
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'stellavista:intro-complete' }, '*');
      return;
    }

    window.location.href = DASHBOARD_URL;
  }, 220);
}

</script>

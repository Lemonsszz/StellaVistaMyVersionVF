<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artemis — Sistema Solar interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.babylonjs.com/babylon.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06040f; --panel:rgba(22,13,48,.78); --panel2:rgba(40,24,84,.38);
  --line:rgba(160,110,255,.17); --line2:rgba(175,130,255,.38);
  --accent:#a66bff; --accent2:#d96bff; --txt:#ebe4ff; --dim:#8f84b8; --good:#7cf0c2;
  --font:'Space Grotesk','Segoe UI',system-ui,sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font)}
button{font-family:inherit;color:inherit;cursor:pointer}
.kicker{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}

/* ── Layout ── */
#app{
  position:fixed;inset:0;display:grid;gap:12px;padding:12px;
  grid-template-columns:292px minmax(0,1fr) 272px;
  grid-template-rows:54px minmax(0,1fr) 76px;
  grid-template-areas:"top top top" "left stage right" "bottom bottom bottom";
  background:radial-gradient(1200px 700px at 50% -10%,#1b0f3d 0%,#0a0618 55%,#05030d 100%);
}
#topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 6px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{height:20px;width:auto;display:block}
.brand em{font-style:normal;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding-left:12px;border-left:1px solid var(--line)}
.top-mid{display:flex;gap:10px;align-items:baseline;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.top-mid .v{color:var(--txt);font-size:.82rem}
.top-right{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--txt)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:8px 12px;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);transition:.2s}
.seg button.on{background:rgba(166,107,255,.28);color:#fff}
.seg button:hover{color:#fff}
.mob{display:none}

.col{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(166,107,255,.3) transparent}
#left{grid-area:left}#right{grid-area:right}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;flex-shrink:0}

/* ── Info ── */
.big{font-size:2.35rem;font-weight:300;line-height:1.05;letter-spacing:-.01em}
.sub{font-size:.8rem;color:var(--dim);margin:6px 0 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.tile span{display:block;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.tile b{font-weight:500;font-size:.8rem;line-height:1.25}
.desc{font-size:.78rem;line-height:1.6;color:#b9afdc;margin-top:14px}

/* ── Toggles ── */
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:8px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel2);cursor:pointer;transition:.2s}
.tog:last-child{margin-bottom:0}
.tog:hover{border-color:var(--line2)}
.tog b{display:block;font-weight:500;font-size:.8rem}
.tog small{display:block;font-size:.64rem;color:var(--dim);margin-top:2px}
.tog input{display:none}
.sw{width:38px;height:22px;border-radius:12px;background:rgba(255,255,255,.08);position:relative;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#bdb2e6;transition:.2s}
.tog input:checked + .sw{background:linear-gradient(90deg,#8d55ff,#c46bff)}
.tog input:checked + .sw::after{transform:translateX(16px);background:#fff;box-shadow:0 0 8px rgba(255,255,255,.7)}

/* ── Lista cuerpos ── */
#list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;border:1px solid transparent;background:var(--panel2);
  font-size:.8rem;text-align:left;width:100%;transition:.2s}
.row:hover{border-color:var(--line2)}
.row.on{border-color:var(--accent);background:rgba(166,107,255,.2)}
.row svg{width:20px;height:20px;flex-shrink:0}
.row svg,.lbl svg{color:rgba(235,228,255,.55);pointer-events:none;transition:color .2s}
.row:hover svg,.row.on svg,.lbl:hover svg,.lbl.on svg{color:#fff}
.ic{display:inline-flex;vertical-align:-.2em;margin-right:.6em}
.lbl svg{width:14px;height:14px;flex-shrink:0}
.row span{flex:1}
.row em{font-style:normal;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:3px 8px;border-radius:7px;border:1px solid var(--line)}

/* ── Sliders ── */
.ctl{margin-bottom:14px}.ctl:last-child{margin-bottom:0}
.ctl .h{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim);margin-bottom:7px}
.ctl .h b{color:var(--txt);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,var(--accent),rgba(166,107,255,.18))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--accent)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--accent)}

.cta{flex-shrink:0;padding:15px;border-radius:14px;border:1px solid var(--line2);background:linear-gradient(135deg,rgba(141,85,255,.35),rgba(217,107,255,.25));
  font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;font-weight:500;transition:.2s}
.cta:hover{background:linear-gradient(135deg,rgba(141,85,255,.55),rgba(217,107,255,.4));box-shadow:0 0 22px rgba(166,107,255,.3)}

/* ── Escenario ── */
#stage{grid-area:stage;position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#04030a;min-height:0}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(90,40,200,.22)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:20px;pointer-events:auto;cursor:pointer;
  background:rgba(14,8,34,.72);border:1px solid var(--line);font-size:.68rem;letter-spacing:.06em;white-space:nowrap;will-change:transform;
  text-shadow:0 1px 3px #000;transition:background .2s,border-color .2s}
.lbl i{width:7px;height:7px;border-radius:50%}
.lbl:hover,.lbl.on{background:rgba(166,107,255,.35);border-color:var(--accent)}
#toast{position:absolute;top:14px;left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;transition:.3s;z-index:6;
  padding:10px 18px;border-radius:12px;background:rgba(20,12,44,.92);border:1px solid var(--line2);font-size:.76rem;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loader{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#05030d;
  font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);transition:opacity .6s}
#loader.off{opacity:0;pointer-events:none}
#loader img{width:min(300px,60%);height:auto;margin-bottom:6px}
.spin{width:38px;height:38px;border-radius:50%;border:2px solid rgba(166,107,255,.2);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── Tour ── */
#tourCard{position:absolute;left:50%;bottom:16px;transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:.35s;z-index:5;
  width:min(560px,calc(100% - 28px));padding:16px 18px;border-radius:18px;background:rgba(14,8,34,.9);border:1px solid var(--line2)}
#tourCard.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#tourCard .kicker{margin-bottom:6px;color:var(--accent)}
#tourCard h4{font-weight:500;font-size:1.25rem;margin-bottom:6px}
#tourCard p{font-size:.8rem;line-height:1.55;color:#c4badf;min-height:2.6em}
.tbar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin:12px 0}
.tbar div{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#8d55ff,#d96bff)}
.tbtns{display:flex;gap:8px;justify-content:flex-end}
.tbtns button{padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase}
.tbtns button{display:inline-flex;align-items:center;gap:6px}
.tbtns .chv{opacity:.65;flex-shrink:0}
.tbtns button:hover{border-color:var(--accent)}
.tbtns button:hover .chv{opacity:1}
.pbtn,.cta .ic{color:rgba(255,255,255,.82)}
.pbtn:hover{color:#fff}
.pbtn svg{display:block;margin:auto}

/* ── Barra inferior ── */
#bottombar{grid-area:bottom;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--panel);border:1px solid var(--line);border-radius:18px}
#bottombar .kicker{margin:0;white-space:nowrap}
.pbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:rgba(166,107,255,.18);font-size:1rem;flex-shrink:0;transition:.2s}
.pbtn:hover{background:rgba(166,107,255,.38)}
.tl{flex:1;min-width:120px}
.tl .h{display:flex;justify-content:space-between;font-size:.68rem;letter-spacing:.1em;color:var(--dim);margin-bottom:8px;text-transform:uppercase}
.tl .h b{color:var(--txt);font-weight:500}
.sbtn{padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;transition:.2s}
.sbtn:hover{border-color:var(--accent)}

/* ── Responsive ── */
@media (max-width:1100px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:54px minmax(0,1fr) 76px;grid-template-areas:"top" "stage" "bottom"}
  #left,#right{position:fixed;top:78px;bottom:100px;width:min(310px,88vw);z-index:30;transition:transform .3s;background:#0b0618;padding:4px;border-radius:18px}
  #left{left:12px;transform:translateX(-120%)} #right{right:12px;transform:translateX(120%)}
  body.sl #left,body.sr #right{transform:none}
  .mob{display:inline-flex}.top-mid,.brand em,#bottombar>.kicker{display:none}
}
@media (max-width:620px){.sbtn{display:none}.seg button{padding:8px 8px}.chip#fps{display:none}}
</style>
</head>

      rm.specularColor = C3.Black(); rm.emissiveColor = new C3(.14, .12, .09);
      rm.backFaceCulling = false; rm.twoSidedLighting = true;
      ring.material = rm; b.ring = ring; b.extent = d.vr * 2.45;
    }
    const pts = [];
    for (let i = 0; i <= 160; i++) { const a = i / 160 * TAU; pts.push(new V3(Math.cos(a) * d.dist, 0, Math.sin(a) * d.dist)); }
    b.orbit = orbitLine(pts);
    return b;
  }
  DATA.filter(d => d.dist).forEach(buildPlanet);

  /* ── Cometa Halley ── */
  const HAL = { a: 60, e: .9, i: rad(162), P: 27562, M: 4.4 };
  const halleyData = DATA[DATA.length - 1];
  const halleyMesh = BABYLON.MeshBuilder.CreateSphere("halley", { diameter: halleyData.vr * 2, segments: 12 }, scene);
  const hm = new BABYLON.StandardMaterial("halleyM", scene);
  hm.disableLighting = true; hm.emissiveColor = new C3(.8, .93, 1); hm.diffuseColor = C3.Black(); hm.specularColor = C3.Black();
  halleyMesh.material = hm;
  const halleyBody = addBody(halleyData, halleyMesh); halleyBody.mesh = halleyMesh; halleyMesh.metadata = { body: halleyBody.idx };
  const coma = billboard("coma", 2.6, glowTex(150, 200, 255), .9); coma.parent = halleyMesh;

  function keplerE(M, e) { let E = Math.PI; for (let k = 0; k < 8; k++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E)); return E; }
  function halleyAtE(E, out) {
    const xo = HAL.a * (Math.cos(E) - HAL.e), zo = HAL.a * Math.sqrt(1 - HAL.e * HAL.e) * Math.sin(E);
    return out.set(xo, -zo * Math.sin(HAL.i), zo * Math.cos(HAL.i));
  }
  const hp = [];
  for (let i = 0; i <= 240; i++) hp.push(halleyAtE(i / 240 * TAU, new V3()));
  halleyBody.orbit = orbitLine(hp); halleyBody.orbit.color = new C3(.45, .7, 1); halleyBody.orbit.alpha = .22;

  const tail = new BABYLON.ParticleSystem("halleyTail", 320, scene);
  tail.particleTexture = glowTex(170, 210, 255); tail.emitter = halleyMesh;
  const tailEm = tail.createPointEmitter(new V3(1, 0, 0), new V3(1, 0, 0));
  tail.color1 = new BABYLON.Color4(.75, .88, 1, .8); tail.color2 = new BABYLON.Color4(.55, .7, 1, .5); tail.colorDead = new BABYLON.Color4(.3, .4, .9, 0);
  tail.minSize = .12; tail.maxSize = .6; tail.minLifetime = 1; tail.maxLifetime = 2.4;
  tail.emitRate = 110; tail.gravity = V3.Zero(); tail.updateSpeed = .02;
  tail.minEmitPower = 1.5; tail.maxEmitPower = 3; tail.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  tail.start();

  /* ── Cinturón de asteroides (instancias finas = 1 draw call) ── */
  const belt = BABYLON.MeshBuilder.CreateIcoSphere("belt", { radius: .5, subdivisions: 1, flat: true }, scene);
  (function () {
    const N = 2400, mats = new Float32Array(16 * N), cols = new Float32Array(4 * N), m = new BABYLON.Matrix();
    for (let i = 0; i < N; i++) {
      const r = 26.4 + (Math.random() + Math.random() + Math.random() - 1.5) / 1.5 * 3.5, a = Math.random() * TAU;
      const y = (Math.random() + Math.random() - 1) * .55, s = .05 + Math.pow(Math.random(), 3) * .24;
      BABYLON.Matrix.ComposeToRef(new V3(s * (.8 + Math.random() * .6), s, s * (.8 + Math.random() * .6)),
        BABYLON.Quaternion.RotationYawPitchRoll(Math.random() * TAU, Math.random() * TAU, Math.random() * TAU),
        new V3(Math.cos(a) * r, y, Math.sin(a) * r), m);
      m.copyToArray(mats, i * 16);
      const br = .32 + Math.random() * .42; cols.set([br * 1.02, br * .94, br * .86, 1], i * 4);
    }
    belt.thinInstanceSetBuffer("matrix", mats, 16, true);
    belt.thinInstanceSetBuffer("color", cols, 4, true);
    const bm = new BABYLON.StandardMaterial("beltM", scene);
    bm.diffuseColor = new C3(1, 1, 1); bm.specularColor = C3.Black(); bm.emissiveColor = new C3(.05, .04, .05);
    belt.material = bm; belt.isPickable = false; belt.alwaysSelectAsActiveMesh = true;
  })();

  /* ── Etiquetas flotantes ── */
  const labelsEl = $("labels");
  bodies.forEach(b => {
    const el = document.createElement("div"); el.className = "lbl";
    el.innerHTML = bodyIcon(b) + b.name;
    el.addEventListener("click", () => focusBody(b));
    labelsEl.appendChild(el); b.label = el; b.visible = true; b.shown = true;
  });
  const _id = BABYLON.Matrix.Identity();
  function updateLabels() {
    if (!L.labels) return;
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const vp = camera.viewport.toGlobal(cw, ch), tm = scene.getTransformMatrix();
    const fovK = ch / (2 * Math.tan(camera.fov / 2));
    for (const b of bodies) {
      let show = b.visible;
      let x = 0, y = 0;
      if (show) {
        const pos = b.root.position, p = V3.Project(pos, _id, tm, vp);
        if (p.z < 0 || p.z > 1 || p.x < -60 || p.x > cw + 60 || p.y < -30 || p.y > ch + 30) show = false;
        else {
          const dist = V3.Distance(camera.position, pos), sc = b.scaleNow || 1;
          x = p.x; y = p.y - Math.max(7, b.radius * sc / dist * fovK) - 8;
        }
      }
      if (show !== b.shown) { b.label.style.display = show ? "" : "none"; b.shown = show; }
      if (show) b.label.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) translate(-50%,-100%)`;
    }
  }

  /* ── Iconos SVG ── */
  const IC = {
    pause: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>',
    play: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 5.8v12.4a.6.6 0 0 0 .9.5l10-6.2a.6.6 0 0 0 0-1l-10-6.2a.6.6 0 0 0-.9.5z"/></svg>',
    stop: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2.2"/></svg>'
  };
  function bodyIcon(b) {
    const ICON_CACHE = bodyIcon.cache || (bodyIcon.cache = {});
    const k = b.star ? "star" : b.comet ? "comet" : b.ring ? "ring" : /gaseoso/.test(b.type) ? "gas" : /helado/.test(b.type) ? "ice" : "rock";
    if (ICON_CACHE[k]) return ICON_CACHE[k];
    const G = {
      star: '<circle cx="12" cy="12" r="3.8"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/>',
      comet: '<circle cx="17" cy="7" r="2.8"/><path d="M14.6 9.2L3.5 19.5M15 11.2L8 19M12.8 6.6L5 12.5" opacity=".6"/>',
      rock: '<circle cx="12" cy="12" r="7.5"/><path d="M7.6 14.6a5 5 0 0 0 3.2 2.5" opacity=".6"/>',
      gas: '<circle cx="12" cy="12" r="7.5"/><path d="M5.1 9.2h13.8M5.1 14.8h13.8" opacity=".7"/>',
      ice: '<circle cx="12" cy="12" r="7.5"/><path d="M4.5 12h15" opacity=".7"/>',
      ring: '<circle cx="12" cy="12" r="5.2"/><g transform="rotate(-20 12 12)"><path d="M1.5 12A10.5 3.2 0 0 0 22.5 12M1.5 12A10.5 3.2 0 0 1 7.8 9.07M22.5 12A10.5 3.2 0 0 0 16.2 9.07"/></g>'
    };
    return ICON_CACHE[k] = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + G[k] + '</svg>';
  }

  /* ── Información / foco ── */
  const bName = $("bName"), bType = $("bType"), tilesEl = $("tiles"), bDesc = $("bDesc");
  function setInfo(b) {
    if (!b) {
      bName.textContent = "Sistema Solar"; bType.textContent = "Vista general"; tilesEl.style.display = "none";
      bDesc.textContent = "Haz clic en un planeta, en su etiqueta o en la lista para acercarte. Arrastra para orbitar y usa la rueda para hacer zoom. Prueba el tour para un recorrido guiado.";
      return;
    }
    bName.textContent = b.name; bType.textContent = b.type; tilesEl.style.display = "";
    tilesEl.innerHTML = TILES.map(([l, k]) => `<div class="tile"><span>${l}</span><b>${b.stats[k]}</b></div>`).join("");
    bDesc.textContent = b.desc;
  }
  function highlight() {
    bodies.forEach(b => {
      const on = b === focus;
      b.label.classList.toggle("on", on);
      if (b.orbit) { b.orbit.alpha = on ? .9 : (b.comet ? .22 : .28); }
      if (b.row) b.row.classList.toggle("on", on);
    });
  }
  function focusBody(b, fromTour) {
    if (!b) { goOverview(fromTour); return; }
    if (!fromTour && tour.active) stopTour();
    focus = b; setInfo(b); highlight();
    const sc = b.star || b.comet ? 1 : planetScale;
    goal = { radius: b.fit || Math.max(3.4, b.extent * sc * 3.2), beta: null, t: 2.2 };
    closeDrawers();
  }
  function goOverview(fromTour) {
    if (!fromTour && tour.active) stopTour();
    focus = null; setInfo(null); highlight();
    goal = { radius: 130, beta: 1.1, t: 2.4 };
    closeDrawers();
  }

  /* ── Selección con clic ── */
  scene.onPointerObservable.add(pi => {
    if (pi.type !== BABYLON.PointerEventTypes.POINTERTAP) return;
    const pick = scene.pick(scene.pointerX, scene.pointerY, m => m.metadata && m.metadata.body !== undefined);
    if (pick && pick.hit) focusBody(bodies[pick.pickedMesh.metadata.body]);
  });

  /* ── Lista lateral ── */
  const listEl = $("list");
  bodies.forEach(b => {
    const r = document.createElement("button"); r.className = "row";
    const tag = b.star ? "Estrella" : b.comet ? "Cometa" : b.stats.dist.split("·")[1].trim();
    r.innerHTML = bodyIcon(b) + `<span>${b.name}</span><em>${tag}</em>`;
    r.onclick = () => focusBody(b); listEl.appendChild(r); b.row = r;
  });

  /* ── Texturas reales (opcionales) ── */
  function applyTexture(b) {
    const slot = b.star ? "emissiveTexture" : "diffuseTexture", mat = b.star ? sunMat : b.mat;
    if (!mat) return;
    mat[slot] = (L.real && b.realTex) ? b.realTex : (b.star ? sunProc : b.proc);
  }
  function loadReal(b) {
    if (!b.data.file || b.realTex || b.loading) return;
    b.loading = true;
    const t = new BABYLON.Texture(TEX_BASE + b.data.file, scene, false, true, BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
      () => { b.realTex = t; t.anisotropicFilteringLevel = 4; applyTexture(b); },
      () => { b.loading = false; if (++texFails === 1) toast("No se pudieron descargar las texturas reales; se usan las procedurales."); });
  }
  function refreshTextures() { bodies.forEach(b => { if (L.real) loadReal(b); applyTexture(b); }); }

  /* ── Capas y calidad ── */
  function applyLayers() {
    const q = QUAL[qIdx];
    bodies.forEach(b => {
      if (b.orbit) b.orbit.setEnabled(L.orbits && (!b.comet || L.halley));
      if (b.atm) b.atm.setEnabled(L.atm && q.atm);
      if (b.clouds) b.clouds.setEnabled(L.atm && q.atm);
      b.visible = b.comet ? L.halley : true;
    });
    halleyMesh.setEnabled(L.halley); coma.setEnabled(L.halley);
    if (L.halley) tail.start(); else tail.stop();
    belt.setEnabled(L.belt); belt.thinInstanceCount = q.belt;
    sky.setEnabled(L.stars);
    labelsEl.style.display = L.labels ? "" : "none";
    if (!L.halley && focus === halleyBody) goOverview();
  }
  function setQuality(i, auto) {
    qIdx = i; const q = QUAL[i];
    engine.setHardwareScalingLevel(q.hw);
    glow.isEnabled = i < 2;
    document.querySelectorAll("#qSeg button").forEach(btn => btn.classList.toggle("on", +btn.dataset.q === i));
    applyLayers(); engine.resize();
    if (auto) toast("Rendimiento ajustado automáticamente: calidad " + q.name.toLowerCase() + ".");
  }
  document.querySelectorAll("#qSeg button").forEach(btn => btn.onclick = () => { autoQ = false; setQuality(+btn.dataset.q); });

  /* ── Toast ── */
  let toastT = 0; const toastEl = $("toast");
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 4200); }

  /* ── Controles ── */
  function bindToggle(id, key, extra) { const el = $(id); el.addEventListener("change", () => { L[key] = el.checked; if (extra) extra(); applyLayers(); }); }
  bindToggle("t-orbits", "orbits"); bindToggle("t-labels", "labels"); bindToggle("t-belt", "belt"); bindToggle("t-atm", "atm");
  bindToggle("t-halley", "halley"); bindToggle("t-stars", "stars"); bindToggle("t-autorot", "autorot");
  bindToggle("t-real", "real", refreshTextures);

  function fmtRate(d) { return d >= 365 ? (d / 365.25).toFixed(1).replace(".", ",") + " años/s" : (d < 10 ? d.toFixed(1).replace(".", ",") : Math.round(d)) + " días/s"; }
  function setTimeFromSlider() {
    const v = +$("s-time").value;
    daysPerSec = v === 0 ? 0 : Math.round(Math.pow(10, v / 25 - 1) * 10) / 10;
    $("v-time").textContent = daysPerSec === 0 ? "Detenido" : fmtRate(daysPerSec);
  }
  $("s-time").addEventListener("input", setTimeFromSlider); setTimeFromSlider();
  $("s-psc").addEventListener("input", e => {
    planetScale = +e.target.value; $("v-psc").textContent = planetScale.toFixed(1).replace(".", ",") + "×";
    bodies.forEach(b => { if (!b.star && !b.comet) { b.root.scaling.setAll(planetScale); b.scaleNow = planetScale; } });
  });
  $("s-hsp").addEventListener("input", e => { halleyMult = +e.target.value; $("v-hsp").textContent = halleyMult + "×"; });
  $("s-fov").addEventListener("input", e => { camera.fov = rad(+e.target.value); $("v-fov").textContent = e.target.value + "°"; });

  const playBtn = $("btnPlay");
  function togglePause() { paused = !paused; playBtn.innerHTML = paused ? IC.play : IC.pause; }
  playBtn.innerHTML = IC.pause;
  playBtn.onclick = togglePause;
  $("btnOverview").onclick = () => goOverview();

  /* ── Drawers móviles ── */
  function closeDrawers() { document.body.classList.remove("sl", "sr"); }
  $("btnLeft").onclick = () => { document.body.classList.toggle("sl"); document.body.classList.remove("sr"); };
  $("btnRight").onclick = () => { document.body.classList.toggle("sr"); document.body.classList.remove("sl"); };

  /* ── Tour ── */
  const tour = { active: false, i: 0, t: 0, paused: false };
  const byId = id => bodies.find(b => b.id === id);
  const tCard = $("tourCard");
  function gotoStop(i) {
    tour.i = clamp(i, 0, STOPS.length - 1); tour.t = 0;
    const s = STOPS[tour.i], b = s.b ? byId(s.b) : null;
    if (b && b.comet && !L.halley) { $("t-halley").checked = true; L.halley = true; applyLayers(); }
    if (b) { focusBody(b, true); goal.beta = 1.2; }
    else { focus = null; setInfo(null); highlight(); goal = { radius: s.view.radius, beta: s.view.beta, t: 2.4 }; }
    $("tourKick").textContent = `TOUR · ${tour.i + 1} / ${STOPS.length}`;
    $("tourTitle").textContent = s.title || b.name;
    $("tourText").textContent = s.text || b.tour;
  }
  function startTour() {
    tour.active = true; tour.paused = false; $("tPause").textContent = "Pausa";
    tCard.classList.add("on"); $("btnTour").innerHTML = '<span class="ic">' + IC.stop + '</span>Detener tour'; closeDrawers(); gotoStop(0);
  }
  function stopTour() { tour.active = false; tCard.classList.remove("on"); $("btnTour").innerHTML = '<span class="ic">' + IC.play + '</span>Iniciar tour'; }
  $("btnTour").innerHTML = '<span class="ic">' + IC.play + '</span>Iniciar tour';
  $("btnTour").onclick = () => tour.active ? stopTour() : startTour();
  $("tNext").onclick = () => { if (tour.i < STOPS.length - 1) gotoStop(tour.i + 1); else stopTour(); };
  $("tPrev").onclick = () => gotoStop(tour.i - 1);
  $("tPause").onclick = () => { tour.paused = !tour.paused; $("tPause").textContent = tour.paused ? "Reanudar" : "Pausa"; };
  $("tExit").onclick = stopTour;

  window.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
    if (e.code === "Space") { e.preventDefault(); togglePause(); }
    else if (e.key === "t" || e.key === "T") { tour.active ? stopTour() : startTour(); }
    else if (e.key === "Escape") { tour.active ? stopTour() : goOverview(); }
    else if (e.key === "ArrowRight" && tour.active) $("tNext").click();
    else if (e.key === "ArrowLeft" && tour.active) $("tPrev").click();
  });

  /* ── Resize ── */
  if (window.ResizeObserver) new ResizeObserver(() => engine.resize()).observe($("stage"));
  window.addEventListener("resize", () => engine.resize());

  /* ── Bucle principal ── */
  const tmp = new V3(), dirAway = new V3(), dateEl = $("simDate"), fpsv = $("fpsv");
  let hudT = 0, lowT = 0, startAt = 0, lastDate = "";

  function step(dt) {
    const dDays = paused ? 0 : dt * daysPerSec;
    simDays += dDays;
    const dJ = j2000Days + simDays;

    for (const b of bodies) {
      const d = b.data;
      if (d.dist) {
        const a = rad(d.L0) + TAU * dJ / d.period;
        b.root.position.set(Math.cos(a) * d.dist, 0, Math.sin(a) * d.dist);
        if (!paused) { b.mesh.rotation.y += b.spin * dt; if (b.clouds) b.clouds.rotation.y += b.spin * 1.15 * dt; }
      }
    }
    if (!paused) sunMesh.rotation.y += .03 * dt;
    belt.rotation.y += TAU / 1680 * dDays;

    if (L.halley) {
      HAL.M = (HAL.M + TAU * dDays * halleyMult / HAL.P) % TAU;
      halleyAtE(keplerE(HAL.M, HAL.e), halleyMesh.position);
      const dist = halleyMesh.position.length(), act = clamp(1 - (dist - 20) / 80, 0, 1);
      dirAway.copyFrom(halleyMesh.position).normalize();
      tailEm.direction1.set(dirAway.x - .22, dirAway.y - .12, dirAway.z - .22);
      tailEm.direction2.set(dirAway.x + .22, dirAway.y + .12, dirAway.z + .22);
      tail.emitRate = 130 * act; const pw = .6 + 2.2 * act;
      tail.minEmitPower = pw * .6; tail.maxEmitPower = pw;
      coma.material.alpha = .35 + .6 * act;
    }

    /* cámara */
    if (tour.active) {
      if (!tour.paused) {
        tour.t += dt;
        const dw = STOPS[tour.i].dwell || 9;
        $("tourBar").style.width = Math.min(100, tour.t / dw * 100) + "%";
        if (tour.t >= dw) { if (tour.i < STOPS.length - 1) gotoStop(tour.i + 1); else stopTour(); }
      }
      camera.alpha += .11 * dt;
    } else if (L.autorot) camera.alpha += .06 * dt;

    const tgt = focus ? focus.root.position : V3.ZeroReadOnly;
    V3.LerpToRef(camera.target, tgt, 1 - Math.exp(-dt * 7), camera.target);
    if (goal.t > 0) {
      const k = 1 - Math.exp(-dt * 3.2);
      if (goal.radius) camera.radius += (goal.radius - camera.radius) * k;
      if (goal.beta != null) camera.beta += (goal.beta - camera.beta) * k;
      goal.t -= dt;
    }

    /* fecha simulada */
    const ds = new Date(startMs + simDays * 86400000).toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" }).toUpperCase();
    if (ds !== lastDate) { dateEl.textContent = ds; lastDate = ds; }
  }

  function hud(dt) {
    hudT += dt;
    if (hudT < .5) return;
    hudT = 0;
    const f = engine.getFps(); fpsv.textContent = Math.round(f);
    if (autoQ && startAt && performance.now() - startAt > 6000 && f < 26 && !document.hidden) {
      lowT += .5; if (lowT >= 4 && qIdx < 2) { setQuality(qIdx + 1, true); lowT = 0; }
    } else lowT = 0;
  }

  engine.runRenderLoop(() => {
    const dt = Math.min(engine.getDeltaTime() / 1000, .1);
    step(dt); scene.render(); updateLabels(); hud(dt);
  });

  /* ── Inicio ── */
  setInfo(null); highlight(); setQuality(0); refreshTextures();
  scene.executeWhenReady(() => {
    $("loader").classList.add("off"); startAt = performance.now();
    toast("Haz clic en un planeta o pulsa T para iniciar el tour.");
  });
}
})();
</script>
</body>
</html>
